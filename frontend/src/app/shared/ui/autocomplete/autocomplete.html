<div class="autocomplete">
  <input
    #autocompleteInput
    class="autocomplete-input"
    type="text"
    role="combobox"
    autocomplete="off"
    [value]="value()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="panelVisible()"
    [attr.aria-controls]="
      panelVisible()
        ? listboxId
        : null
    "
    [attr.aria-activedescendant]="
      activeDescendant()
    "
    aria-autocomplete="list"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keydown)="onKeydown($event)"
  />

  @if (panelVisible()) {
    <div
      class="autocomplete-panel"
      [id]="listboxId"
      role="listbox"
    >
      @if (isLoading()) {
        <div
          class="autocomplete-status"
          role="status"
        >
          Recherche…
        </div>
      } @else {
        @for (
          option of options();
          track option.id;
          let index = $index
          ) {
          <div
            class="autocomplete-option"
            role="option"
            [id]="optionId(index)"
            [class.active]="
              activeIndex() === index
            "
            [attr.aria-selected]="
              activeIndex() === index
            "
            (mousedown)="
              selectOption(
                $event,
                option
              )
            "
          >
            <span
              class="autocomplete-option-label"
            >
              {{ option.label }}
            </span>

            @if (
              option.description
              ) {
              <small>
                {{ option.description }}
              </small>
            }
          </div>
        }
      }
    </div>
  }
</div>
