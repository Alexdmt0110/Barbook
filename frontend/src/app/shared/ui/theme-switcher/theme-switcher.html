<div class="theme-switcher">
  <button
    #themeTrigger
    type="button"
    class="theme-trigger"
    aria-haspopup="dialog"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="
      'Thème d’affichage : ' + currentThemeLabel()
    "
    title="Changer le thème"
    (click)="toggleMenu()"
  >
    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <circle
        cx="12"
        cy="12"
        r="8"
        class="theme-icon-outline"
      />

      <path
        d="M12 4a8 8 0 0 0 0 16V4Z"
        class="theme-icon-fill"
      />
    </svg>
  </button>

  @if (isOpen()) {
    <section
      class="theme-panel"
      role="dialog"
      aria-label="Choisir le thème d’affichage"
    >
      <p class="theme-panel-label">
        Apparence
      </p>

      <div class="theme-options">
        @for (option of options; track option.value) {
          <button
            type="button"
            class="theme-option"
            [class.selected]="currentTheme() === option.value"
            [attr.aria-pressed]="
              currentTheme() === option.value
            "
            (click)="selectTheme(option.value)"
          >
            <span
              class="theme-preview"
              [attr.data-theme-preview]="option.value"
              aria-hidden="true"
            ></span>

            <span class="theme-option-copy">
              <strong>{{ option.label }}</strong>
              <small>{{ option.description }}</small>
            </span>

            @if (currentTheme() === option.value) {
              <span
                class="selected-indicator"
                aria-hidden="true"
              >
                ✓
              </span>
            }
          </button>
        }
      </div>
    </section>
  }
</div>
